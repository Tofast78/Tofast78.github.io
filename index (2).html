<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tofast78 · GitHub Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #21262d;
      --accent:   #58a6ff;
      --accent2:  #3fb950;
      --muted:    #8b949e;
      --text:     #e6edf3;
      --text-dim: #c9d1d9;
    }

    body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }

    /* HERO */
    header {
      position: relative; overflow: hidden;
      padding: 64px 24px 48px; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(88,166,255,.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .avatar { width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--accent); margin: 0 auto 20px; display: block; background: var(--surface); object-fit: cover; }
    header h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: -1px; }
    header h1 span { color: var(--accent); }
    .bio { margin-top: 10px; color: var(--muted); font-size: 1rem; max-width: 480px; margin-inline: auto; }
    .stats-row { display: flex; justify-content: center; gap: 32px; margin-top: 28px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; font-weight: 600; color: var(--accent); }
    .stat-label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
    .gh-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 10px 22px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); text-decoration: none; font-size: .9rem; transition: border-color .2s, color .2s; }
    .gh-link:hover { border-color: var(--accent); color: var(--accent); }

    /* SECTION TITLE */
    .section-title {
      max-width: 1100px; margin: 40px auto 0; padding: 0 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-title h2 { font-size: 1rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .1em; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* PAGES GRID */
    .pages-grid {
      max-width: 1100px; margin: 20px auto 0; padding: 0 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }

    .page-card {
      background: var(--surface);
      border: 1px solid var(--accent2);
      border-radius: 12px; padding: 22px;
      display: flex; flex-direction: column; gap: 10px;
      text-decoration: none; color: inherit;
      position: relative; overflow: hidden;
      transition: transform .2s, box-shadow .2s;
    }
    .page-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(63,185,80,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .page-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(63,185,80,.15); }

    .page-card-top { display: flex; align-items: center; gap: 10px; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent2); flex-shrink: 0; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
    .page-name { font-family: 'JetBrains Mono', monospace; font-size: .95rem; font-weight: 600; color: var(--accent2); word-break: break-word; }
    .page-desc { font-size: .85rem; color: var(--muted); line-height: 1.5; flex: 1; }
    .page-url { font-size: .75rem; color: var(--accent); opacity: .7; font-family: 'JetBrains Mono', monospace; }
    .page-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 4px; padding: 8px 16px;
      background: rgba(63,185,80,.12); border: 1px solid var(--accent2);
      border-radius: 8px; color: var(--accent2);
      font-size: .8rem; font-weight: 600; width: fit-content;
      transition: background .2s;
    }
    .page-card:hover .page-btn { background: rgba(63,185,80,.22); }

    /* CONTROLS */
    .controls { max-width: 1100px; margin: 32px auto 0; padding: 0 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    input[type="search"] { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 10px 38px; color: var(--text); font-family: inherit; font-size: .9rem; outline: none; transition: border-color .2s; }
    input[type="search"]:focus { border-color: var(--accent); }
    input[type="search"]::placeholder { color: var(--muted); }
    select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text-dim); font-family: inherit; font-size: .9rem; outline: none; cursor: pointer; transition: border-color .2s; }
    select:focus { border-color: var(--accent); }

    /* REPOS GRID */
    .grid { max-width: 1100px; margin: 24px auto 64px; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color .2s, transform .2s; text-decoration: none; color: inherit; }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-top { display: flex; align-items: flex-start; gap: 10px; }
    .repo-icon { flex-shrink: 0; margin-top: 2px; color: var(--muted); }
    .repo-name { font-family: 'JetBrains Mono', monospace; font-size: .95rem; font-weight: 600; color: var(--accent); word-break: break-word; }
    .fork-badge { margin-left: auto; flex-shrink: 0; font-size: .7rem; padding: 2px 8px; border: 1px solid var(--border); border-radius: 20px; color: var(--muted); }
    .repo-desc { font-size: .85rem; color: var(--muted); line-height: 1.5; flex: 1; }
    .topics { display: flex; flex-wrap: wrap; gap: 6px; }
    .topic { font-size: .72rem; padding: 3px 10px; background: rgba(88,166,255,.1); color: var(--accent); border-radius: 20px; }
    .card-meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; gap: 5px; font-size: .8rem; color: var(--muted); }
    .lang-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* STATES */
    .state { max-width: 1100px; margin: 64px auto; padding: 0 24px; text-align: center; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; padding: 24px; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); }

    @media (max-width: 480px) {
      .stats-row { gap: 20px; }
      .controls { flex-direction: column; }
      select { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <img class="avatar" id="avatar" src="" alt="Tofast78"/>
  <h1><span>Tofast78</span></h1>
  <p class="bio" id="bio">A carregar perfil…</p>
  <div class="stats-row">
    <div class="stat"><div class="stat-num" id="stat-repos">–</div><div class="stat-label">Repositórios</div></div>
    <div class="stat"><div class="stat-num" id="stat-followers">–</div><div class="stat-label">Seguidores</div></div>
    <div class="stat"><div class="stat-num" id="stat-stars">–</div><div class="stat-label">Stars totais</div></div>
  </div>
  <a class="gh-link" href="https://github.com/Tofast78" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577v-2.165c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.929.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
    Ver no GitHub
  </a>
</header>

<!-- PÁGINAS AO VIVO -->
<div class="section-title"><h2>🌐 Páginas ao vivo</h2></div>
<div class="pages-grid" id="pages-grid"></div>

<!-- TODOS OS REPOSITÓRIOS -->
<div class="section-title" style="margin-top:48px"><h2>📦 Todos os repositórios</h2></div>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="search" placeholder="Pesquisar repositórios…"/>
  </div>
  <select id="sort">
    <option value="updated">Atualizado recentemente</option>
    <option value="stars">Mais stars</option>
    <option value="name">Nome (A–Z)</option>
    <option value="forks">Mais forks</option>
  </select>
  <select id="lang-filter">
    <option value="">Todas as linguagens</option>
  </select>
</div>

<div id="state" class="state"><div class="spinner"></div><p>A carregar repositórios…</p></div>
<div class="grid" id="grid" style="display:none"></div>

<footer>Feito com ♥ · Dados via <a href="https://api.github.com" style="color:var(--accent);text-decoration:none">GitHub API</a></footer>

<script>
const USER = 'Tofast78';
const PORTFOLIO_REPO = `${USER}.github.io`;
const LANG_COLORS = {
  JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5', HTML:'#e34c26',
  CSS:'#563d7c', Java:'#b07219', 'C#':'#178600', 'C++':'#f34b7d', C:'#555',
  Ruby:'#701516', Go:'#00ADD8', Rust:'#dea584', PHP:'#4F5D95', Shell:'#89e051',
  Swift:'#fa7343', Kotlin:'#A97BFF', Dart:'#00B4AB', Vue:'#41b883',
};

let allRepos = [];

async function fetchAll(url) {
  let results = [], page = 1;
  while (true) {
    const r = await fetch(`${url}?per_page=100&page=${page}`);
    if (!r.ok) break;
    const data = await r.json();
    if (!data.length) break;
    results = results.concat(data);
    if (data.length < 100) break;
    page++;
  }
  return results;
}

function getPageUrl(repo) {
  // Repo user.github.io → root domain
  if (repo.name.toLowerCase() === `${USER.toLowerCase()}.github.io`) {
    return `https://${USER}.github.io`;
  }
  // Repos with homepage set
  if (repo.homepage && repo.homepage.includes('github.io')) {
    return repo.homepage;
  }
  // Has pages enabled (has_pages flag)
  if (repo.has_pages) {
    return `https://${USER}.github.io/${repo.name}`;
  }
  return null;
}

async function init() {
  try {
    const [profile, repos] = await Promise.all([
      fetch(`https://api.github.com/users/${USER}`).then(r => r.json()),
      fetchAll(`https://api.github.com/users/${USER}/repos`)
    ]);

    document.getElementById('avatar').src = profile.avatar_url;
    document.getElementById('bio').textContent = profile.bio || 'Desenvolvedor no GitHub';
    document.getElementById('stat-repos').textContent = profile.public_repos;
    document.getElementById('stat-followers').textContent = profile.followers;
    document.getElementById('stat-stars').textContent = repos.reduce((s, r) => s + r.stargazers_count, 0);

    allRepos = repos;

    // Language filter
    const langs = [...new Set(repos.map(r => r.language).filter(Boolean))].sort();
    const sel = document.getElementById('lang-filter');
    langs.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o); });

    // Pages section — exclude portfolio repo itself
    const pagesGrid = document.getElementById('pages-grid');
    const pagesRepos = repos.filter(r => {
      const isPortfolio = r.name.toLowerCase() === PORTFOLIO_REPO.toLowerCase();
      return !isPortfolio && getPageUrl(r) !== null;
    });

    if (pagesRepos.length === 0) {
      pagesGrid.innerHTML = '<p style="color:var(--muted);padding:16px 0">Nenhuma página ao vivo encontrada. Ativa o GitHub Pages nos teus repositórios!</p>';
    } else {
      pagesGrid.innerHTML = pagesRepos.map(r => {
        const url = getPageUrl(r);
        const desc = r.description ? `<p class="page-desc">${r.description}</p>` : '<p class="page-desc" style="font-style:italic">Sem descrição</p>';
        return `
        <a class="page-card" href="${url}" target="_blank" rel="noopener">
          <div class="page-card-top">
            <span class="live-dot"></span>
            <span class="page-name">${r.name}</span>
          </div>
          ${desc}
          <span class="page-url">${url.replace('https://','')}</span>
          <span class="page-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Abrir página
          </span>
        </a>`;
      }).join('');
    }

    renderRepos();
    document.getElementById('state').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
  } catch(e) {
    document.getElementById('state').innerHTML = '<p>Erro ao carregar dados. Verifica a ligação.</p>';
  }
}

function renderRepos() {
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;
  const lang = document.getElementById('lang-filter').value;

  let list = allRepos.filter(r => {
    if (q && !r.name.toLowerCase().includes(q) && !(r.description||'').toLowerCase().includes(q)) return false;
    if (lang && r.language !== lang) return false;
    return true;
  });

  if (sort === 'updated') list.sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  else if (sort === 'stars') list.sort((a,b) => b.stargazers_count - a.stargazers_count);
  else if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sort === 'forks') list.sort((a,b) => b.forks_count - a.forks_count);

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px 0">Nenhum repositório encontrado.</p>';
    return;
  }

  grid.innerHTML = list.map(r => {
    const color = LANG_COLORS[r.language] || '#8b949e';
    const updated = new Date(r.updated_at).toLocaleDateString('pt-PT', {day:'2-digit',month:'short',year:'numeric'});
    const desc = r.description ? `<p class="repo-desc">${r.description}</p>` : '';
    const topics = r.topics?.length ? `<div class="topics">${r.topics.map(t=>`<span class="topic">${t}</span>`).join('')}</div>` : '';
    const fork = r.fork ? '<span class="fork-badge">fork</span>' : '';
    const hasPage = getPageUrl(r);
    const pageBtn = hasPage ? `<a href="${hasPage}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="margin-left:auto;font-size:.75rem;color:var(--accent2);text-decoration:none;display:flex;align-items:center;gap:4px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
      Ver site</a>` : '';

    return `
    <a class="card" href="${r.html_url}" target="_blank" rel="noopener">
      <div class="card-top">
        <svg class="repo-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h6l2 2h10a2 2 0 012 2v12a2 2 0 01-2 2H3a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
        <span class="repo-name">${r.name}</span>
        ${fork}
      </div>
      ${desc}
      ${topics}
      <div class="card-meta">
        ${r.language ? `<span class="meta-item"><span class="lang-dot" style="background:${color}"></span>${r.language}</span>` : ''}
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          ${r.stargazers_count}
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a2 2 0 01-2 2H8a2 2 0 01-2-2V9M12 15v-3"/></svg>
          ${r.forks_count}
        </span>
        <span class="meta-item">${updated}</span>
        ${pageBtn}
      </div>
    </a>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', renderRepos);
document.getElementById('sort').addEventListener('change', renderRepos);
document.getElementById('lang-filter').addEventListener('change', renderRepos);

init();
</script>
</body>
</html>
